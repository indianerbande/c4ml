packages:
  - packages/*
  - apps/*

allowBuilds:
  '@parcel/watcher': false
  'electron-winstaller@5.4.4': true
  'esbuild@0.28.2': true
  'fs-xattr@0.3.1': true
  lmdb: false
  'macos-alias@0.2.12': true
  msgpackr-extract: false

hoistPattern:
  - '*'

minimumReleaseAgeExclude:
  - '@angular/common@22.1.4'
  - '@angular/compiler-cli@22.1.4'
  - '@angular/compiler@22.1.4'
  - '@angular/core@22.1.4'
  - '@angular/platform-browser@22.1.4'

overrides:
  '@electron/node-gyp>tar': '7.5.22'
  '@electron/rebuild@3.7.2>@electron/node-gyp': '10.2.0-electron.2'
  '@electron/rebuild>tar': '7.5.22'
  'cacache>tar': '7.5.22'
  dompurify: '3.4.13'
  'external-editor>tmp': '0.2.7'
  qs: '6.16.0'
  webpack: '5.109.2'
  minimizer-webpack-plugin: '5.7.0'
  terser: '5.51.1'

peerDependencyRules:
  allowedVersions:
    '@electron/fuses': '2.1.3'
